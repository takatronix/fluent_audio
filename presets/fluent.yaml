# fluent — soft liquid: a gentle 3-voice chorus, a little width, a faint octave-up shimmer.
schema: fluent.sound/v1alpha1
name: fluent
extends: voice_base
io: { in: mono, out: stereo }
params:
  shimmer: { type: f32, default: 0.22, range: [0, 0.5], animate: { duration: 0.8, ease: ease_in_out } }
chain:
  - eq: { bands: [ { type: lowshelf, f: 180, gain_db: -1.5 },
                   { type: peak, f: 2800, q: 0.9, gain_db: 1.5 },
                   { type: highshelf, f: 9000, gain_db: 3 } ] }
  - exciter: { freq: 5000, drive: 2.5, mix: 0.10 }
  - send: { to: room, gain: 0.10 }
  - send: { to: shimmer, gain: $params.shimmer }
  - chorus: { voices: 3, rate_hz: 0.18, depth_ms: 1.8, base_ms: 9, mix: 0.28 }
  - widen: { width: 1.3, bass_mono_hz: 150 }
buses:
  room:    [ reverb: { decay_s: 1.6, size: 0.8, damp_hz: 8000, predelay_ms: 18 } ]
  shimmer: [ shimmer: { semitones: 12, decay_s: 2.8, size: 1.1, damp_hz: 9000, predelay_ms: 40, hp_hz: 600, mix: 1 } ]
analysis: { voice: true, level: true, onset: true, centroid: true, tail: true }
