# Shared front end of every voice look: rumble cut, gentle levelling, de-ess. Other presets `extends:` this.
schema: fluent.sound/v1alpha1
name: voice_base
io: { in: mono, out: mono }
params:
  amount: { type: f32, default: 1.0, range: [0, 1], runtime_mutable: true,
            animate: { duration: 0.4, ease: ease_in_out } }
  speak:  { type: f32, default: 0, range: [0, 1], runtime_mutable: true, animate: { duration: 0.3 } }   # mood weights, as the faces
  think:  { type: f32, default: 0, range: [0, 1], runtime_mutable: true, animate: { duration: 0.3 } }
chain:
  - eq: { bands: [ { type: hp, f: 80, q: 0.7 } ] }
  - compressor: { threshold_db: -24, ratio: 2, attack_ms: 10, release_ms: 150, knee_db: 6, makeup_db: 2 }
  - deesser: { freq: 6500, threshold_db: -32, ratio: 3 }
master:
  - mix: { amount: $params.amount }
  - limiter: { ceiling_db: -1 }
