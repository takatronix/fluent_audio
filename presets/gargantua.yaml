# gargantua — deep space: weight below, a long dark space and an octave-down shimmer, both kept low.
schema: fluent.sound/v1alpha1
name: gargantua
extends: voice_base
io: { in: mono, out: stereo }
params:
  space: { type: f32, default: 0.14, range: [0, 0.3], animate: { duration: 1.0, ease: ease_in_out } }
chain:
  - eq: { bands: [ { type: lowshelf, f: 160, gain_db: 2 },
                   { type: peak, f: 3000, q: 1.0, gain_db: 1 },
                   { type: highshelf, f: 8000, gain_db: -1 } ] }
  - send: { to: space, gain: $params.space }
  - send: { to: deep, gain: 0.12 }
buses:
  space: [ reverb: { decay_s: 5.5, size: 1.6, damp_hz: 3500, predelay_ms: 60 } ]
  deep:  [ shimmer: { semitones: -12, decay_s: 6.0, size: 1.8, damp_hz: 2500, predelay_ms: 90, hp_hz: 400, mix: 1 } ]
analysis: { level: true, onset: true, centroid: true, tail: true }
