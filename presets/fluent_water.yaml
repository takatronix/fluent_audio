# fluent (water) — light through water: a slow stereo phaser drifting over a soft double, in a gentle room.
schema: fluent.sound/v1alpha1
name: fluent_water
extends: voice_base
io: { in: mono, out: stereo }
trim_db: 0
chain:
  - eq: { bands: [ { type: lowshelf, f: 220, gain_db: 1 },
                   { type: peak, f: 3600, q: 1.2, gain_db: -1.5 },
                   { type: highshelf, f: 10000, gain_db: 1.5 } ] }
  - compressor: { threshold_db: -20, ratio: 1.8, attack_ms: 20, release_ms: 200, knee_db: 8, makeup_db: 1 }
  - send: { to: room, gain: 0.14 }
  - microshift: { cents: 6, delay_ms: 10, mix: 0.22 }
  - phaser: { stages: 4, rate_hz: 0.12, low_hz: 350, high_hz: 3500, feedback: 0.25, depth: 0.45, stereo: 0.3 }
buses:
  room:
    - eq: { bands: [ { type: hp, f: 250, q: 0.7 } ] }
    - reverb: { decay_s: 1.8, size: 1.0, damp_hz: 6500, predelay_ms: 20, diffusion: 0.8, mod: 0.5 }
analysis: { voice: true, level: true, onset: true, centroid: true, tail: true }
