# fluent (space) — wide and airy: a pre-delayed lush hall at low level, so the voice stays in front of it.
schema: fluent.sound/v1alpha1
name: fluent_space
extends: voice_base
io: { in: mono, out: stereo }
trim_db: 0
chain:
  - eq: { bands: [ { type: lowshelf, f: 220, gain_db: 1 },
                   { type: peak, f: 3600, q: 1.2, gain_db: -1.5 },
                   { type: highshelf, f: 10000, gain_db: 2 } ] }
  - compressor: { threshold_db: -20, ratio: 1.8, attack_ms: 20, release_ms: 200, knee_db: 8, makeup_db: 1 }
  - send: { to: hall, gain: 0.16 }
  - microshift: { cents: 7, delay_ms: 12, mix: 0.2 }
  - widen: { width: 1.2, bass_mono_hz: 200 }
buses:
  hall:
    - eq: { bands: [ { type: hp, f: 300, q: 0.7 } ] }
    - reverb: { decay_s: 2.8, size: 1.8, damp_hz: 7000, predelay_ms: 70, diffusion: 0.8, mod: 0.5 }
analysis: { voice: true, level: true, onset: true, centroid: true, tail: true }
