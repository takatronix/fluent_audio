# gargantua (tesseract) — the organ moving: Am → F → C → G one chord per phrase on bright ranks (4', 2', the
# twelfth), a six-voice choir, and the end of each phrase stretched in time — frozen, sinking a fifth as it
# fades into a 7 s hall. Dry not delayed.
schema: fluent.sound/v1alpha1
name: gargantua_tesseract
extends: voice_base
io: { in: mono, out: stereo }
trim_db: 1.9        # loudness matched to the dry voice (fa_render --loudness)
budget: { flops_per_sample: 1000 }
chain:
  - eq: { bands: [ { type: lowshelf, f: 140, gain_db: 1.5 },
                   { type: peak, f: 2800, q: 1.0, gain_db: 1.5 },
                   { type: highshelf, f: 9000, gain_db: -1 } ] }
  - send: { to: organ, gain: 1 }
  - send: { to: time, gain: 1 }
  - send: { to: hall, gain: 0.14 }
  - choir: { voices: 6, cents: 9, delay_ms: 16, drift: 0.35, tone_hz: 5500, spread: 0.9, mix: 0.25 }
buses:
  organ:
    - organ: { chords: cycle, r16: 0.6, r8: 0.9, r4: 0.7, quint: 0.3, r2: 0.5, celeste: 5, swell_ms: 700,
               sustain_s: 0.5, release_s: 4, tone_hz: 5000, spread: 0.9, level: 1.9 }
    - reverb: { decay_s: 7, size: 2.3, damp_hz: 3500, predelay_ms: 30, diffusion: 0.8, mod: 0.6, mix: 0.6 }
  time:
    - dilate: { hold_ms: 300, grain_ms: 140, decay_s: 6, glide_st: -7, level: 1.8 }
    - eq: { bands: [ { type: hp, f: 200, q: 0.7 }, { type: highshelf, f: 5000, gain_db: -4 } ] }
    - reverb: { decay_s: 7, size: 1.4, damp_hz: 3000, predelay_ms: 20, diffusion: 0.85, mod: 0.6, mix: 0.7 }
  hall:
    - eq: { bands: [ { type: hp, f: 180, q: 0.7 } ] }
    - reverb: { decay_s: 7, size: 2.3, damp_hz: 3000, predelay_ms: 60, diffusion: 0.8, mod: 0.6 }
analysis: { voice: true, level: true, onset: true, centroid: true, tail: true }
