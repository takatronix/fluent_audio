# gargantua (horizon) — at the event horizon: an octave under the voice that follows it, a deep organ drone (16'
# strongest, dark), and time slowing at the end of each phrase — the last syllable freezes and sinks two
# semitones into an 8 s dark space. Dry not delayed.
schema: fluent.sound/v1alpha1
name: gargantua_horizon
extends: voice_base
io: { in: mono, out: stereo }
trim_db: 0
budget: { flops_per_sample: 1000 }
chain:
  - eq: { bands: [ { type: lowshelf, f: 140, gain_db: 1 },
                   { type: peak, f: 2800, q: 1.0, gain_db: 1.5 },
                   { type: highshelf, f: 9000, gain_db: -2 } ] }
  - subharmonic: { band_hz: 260, lp_hz: 140, amount: 0.45 }
  - send: { to: organ, gain: 1 }
  - send: { to: time, gain: 1 }
  - send: { to: hall, gain: 0.12 }
  - choir: { voices: 4, cents: 6, delay_ms: 14, drift: 0.3, tone_hz: 4500, spread: 0.8, mix: 0.18 }
buses:
  organ:
    - organ: { chords: drone, r16: 1, r8: 0.8, r4: 0.25, quint: 0, r2: 0, swell_ms: 1000, sustain_s: 0.6,
               release_s: 5, tone_hz: 1600, spread: 0.5, level: 1.4 }
    - reverb: { decay_s: 8, size: 2.5, damp_hz: 1800, predelay_ms: 40, diffusion: 0.85, mod: 0.6, mix: 0.6 }
  time:
    - dilate: { hold_ms: 250, grain_ms: 120, decay_s: 5, glide_st: -2, level: 0.5 }
    - eq: { bands: [ { type: hp, f: 150, q: 0.7 }, { type: highshelf, f: 4000, gain_db: -6 } ] }
    - reverb: { decay_s: 8, size: 1.4, damp_hz: 2000, predelay_ms: 20, diffusion: 0.85, mod: 0.6, mix: 0.7 }
  hall:
    - eq: { bands: [ { type: hp, f: 180, q: 0.7 } ] }
    - reverb: { decay_s: 8, size: 2.5, damp_hz: 1800, predelay_ms: 80, diffusion: 0.85, mod: 0.6 }
analysis: { voice: true, level: true, onset: true, centroid: true, tail: true }
